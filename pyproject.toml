# Конфигурация ruff — линтера, который гоняется в CI.
[tool.ruff]
line-length = 120
target-version = "py313"
# Файлы миграций генерирует Alembic — переформатировать их вручную бессмысленно,
# при следующей автогенерации всё вернётся обратно.
exclude = ["**/alembic/versions/**"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle: ошибки стиля
    "F",   # pyflakes: неиспользуемые импорты, необъявленные имена
    "I",   # isort: порядок импортов
    "UP",  # pyupgrade: устаревшие конструкции
    "B",   # flake8-bugbear: типичные источники багов
]
ignore = [
    # FastAPI-идиома: Depends(...) в значении по умолчанию — так работает
    # внедрение зависимостей, bugbear ругается на это ошибочно.
    "B008",
    # class X(str, Enum) вместо StrEnum — осознанный выбор: именно эту форму
    # используют примеры SQLAlchemy и Pydantic, и значения уже записаны
    # в тип PostgreSQL. Переход на StrEnum меняет поведение str() и format().
    "UP042",
]

[tool.ruff.lint.isort]
# Без этого ruff считает "app" сторонней библиотекой и ставит его импорты
# по алфавиту вперемешку с fastapi и sqlalchemy. Принятый порядок другой:
# стандартная библиотека, затем сторонние пакеты, затем собственный код.
known-first-party = ["app"]
