events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # Логи в stdout/stderr — так их видно через docker compose logs.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # --- Rate limiting ---
    # Зона на 10 МБ хранит счётчики примерно для 160 тысяч адресов.
    # Ключ — $binary_remote_addr, то есть лимит считается на каждый IP отдельно.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;

    # --- Балансировка между двумя инстансами каталога ---
    # По умолчанию round-robin: запросы уходят по очереди в каждый контейнер.
    upstream catalog_backend {
        server service-2-a:8000 max_fails=3 fail_timeout=15s;
        server service-2-b:8000 max_fails=3 fail_timeout=15s;
    }

    upstream order_backend {
        server service-1:8000 max_fails=3 fail_timeout=15s;
    }

    server {
        listen 80;
        server_name _;

        # Общие заголовки для всех проксируемых запросов.
        # Без них приложение видит IP nginx вместо настоящего адреса клиента —
        # тогда логи, аналитика и любые проверки по IP становятся бесполезны.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # Проверка живости самого nginx — не проксируется дальше.
        location = /health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx"}';
        }

        # --- Каталог: рестораны, меню, курьеры ---
        location /api/catalog/ {
            # burst=20 разрешает короткий всплеск сверх лимита (очередь из 20
            # запросов), nodelay отдаёт их сразу, а не размазывает во времени.
            limit_req zone=api_limit burst=20 nodelay;

            # Слэш в конце proxy_pass отрезает префикс /api/catalog/,
            # приложение получает чистый путь вида /restaurants.
            proxy_pass http://catalog_backend/;
        }

        # --- Заказы и пользователи ---
        location /api/orders/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://order_backend/;
        }

        location / {
            return 404 '{"detail":"Unknown route. Use /api/catalog/ or /api/orders/"}';
        }
    }
}
