name: CI

"on":
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Линтер (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Установка ruff
        run: pip install ruff==0.16.6

      - name: Проверка стиля и ошибок
        run: ruff check service-1 service-2

  test:
    name: Тесты (pytest)
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false — если упадут тесты одного сервиса, второй всё равно
      # прогонится, и вы сразу увидите полную картину, а не первую ошибку.
      fail-fast: false
      matrix:
        service: [service-1, service-2]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        # Без healthcheck шаги начнутся раньше, чем база примет подключения.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Установка зависимостей
        working-directory: ${{ matrix.service }}
        run: |
          pip install -r requirements.txt
          pip install pytest==9.1.1 pytest-asyncio==1.4.0 httpx==0.28.1 aiosqlite==0.22.1

      - name: Запуск тестов
        working-directory: ${{ matrix.service }}
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          # Секрет берётся из настроек репозитория (Settings -> Secrets and
          # variables -> Actions). Если он не задан, подставляется тестовое
          # значение, чтобы CI не падал на форках и у сторонних контрибьюторов.
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-secret-for-ci' }}
          JWT_ALGORITHM: HS256
          JWT_EXPIRE_MINUTES: "60"
        run: pytest -v

  build:
    name: Сборка Docker-образов
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        service: [service-1, service-2]
    steps:
      - uses: actions/checkout@v4

      - name: Сборка образа ${{ matrix.service }}
        run: docker build -t orderhub-${{ matrix.service }}:${{ github.sha }} ./${{ matrix.service }}
